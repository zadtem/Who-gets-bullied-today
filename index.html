<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Who Gets Bullied Today?</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Rye&display=swap" rel="stylesheet" />
</head>
<body>
  <main class="app">
    <header class="hero">
      <h1 class="title">Who Gets<br/>Bullied Today?</h1>
      <p class="subtitle">Spin the wheel, partner</p>
    </header>

    <section class="wheel-stage">
      <div class="pointer" aria-hidden="true"></div>
      <div class="wheel-wrap">
        <svg id="wheel" class="wheel" viewBox="-110 -110 220 220" aria-label="Bullying wheel"></svg>
        <div class="hub"></div>
      </div>
    </section>

    <button id="spinBtn" class="spin-btn" type="button">SPIN</button>
  </main>

  <div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="resultName">
    <div class="modal-backdrop" data-close="1"></div>
    <div class="modal-card">
      <button class="close-btn" type="button" data-close="1" aria-label="Close">&times;</button>
      <p class="wanted-label">WANTED</p>
      <div class="star">&#9733;</div>
      <h2 id="resultName" class="result-name">—</h2>
      <p id="resultLine" class="result-line">gets bullied today</p>
      <button id="againBtn" class="again-btn" type="button">Spin again</button>
    </div>
  </div>

  <canvas id="confettiCanvas" class="confetti-canvas" aria-hidden="true"></canvas>

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
